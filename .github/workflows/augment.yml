# Runs the augmentation pipeline for each store, exactly as you would locally:
#   uv sync && uv run snakemake --cores 4 --config store=<store>
# Manual trigger only for now. Outputs are uploaded as artifacts.
#
# Requires two repo secrets for BedMachine (Earthdata): EARTHDATA_USERNAME,
# EARTHDATA_PASSWORD. Icechunk and ITS_LIVE reads need no credentials.

name: augment

on:
  workflow_dispatch:

jobs:
  augment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [antarctica, greenland]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Persist the BedMachine downloads (outputs/cache/) between runs so the
      # ~1-3 GB netCDF/GeoTIFF is fetched once, not every run. restore-keys lets
      # an unchanged dataset survive a config edit (earthaccess skips files it
      # already has); a real version bump downloads the new file.
      - uses: actions/cache@v4
        with:
          path: outputs/cache
          key: bedmachine-${{ matrix.store }}-${{ hashFiles(format('config/{0}.yaml', matrix.store)) }}
          restore-keys: bedmachine-${{ matrix.store }}-

      - run: uv sync

      - run: uv run snakemake --cores 4 --config store=${{ matrix.store }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.store }}
          path: outputs/${{ matrix.store }}
