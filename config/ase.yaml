# Amundsen Sea Embayment (Antarctic). Input store: s3://opr-radar-metrics/icechunk/ase
store:
  backend: "s3"
  s3_bucket: "opr-radar-metrics"
  s3_prefix: "icechunk/ase"
  s3_region: "us-west-2"

icechunk:
  branch: "main"
  snapshot_id: "MDXN4Y1A3B6CCYC9HBY0"  # pinned 2026-07-30: missing bed picks, record-tail noise, pick-free at-depth noise window stats

extract:
  qc_only: true
  max_traces: null  # set e.g. 10000 for a smoke run
  min_thickness_m: 100  # drop traces with radar thickness below this

datasets:
  - name: bedmachine
    region: antarctic
    version: "4"
    variables: [bed, surface, thickness, mask, errbed]
  - name: itslive
    region: antarctic
  - name: era5  # mean t2m from the WeatherBench2 1990-2019 climatology (period fixed by product)
  - name: ghf  # Lösing & Ebbing (2021) geothermal heat flow + lower/upper bounds (regridded, non-topo)
    region: antarctic
