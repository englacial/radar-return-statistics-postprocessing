# Greenland. Input store: s3://opr-radar-metrics/icechunk/greenland
store:
  backend: "s3"
  s3_bucket: "opr-radar-metrics"
  s3_prefix: "icechunk/greenland"
  s3_region: "us-west-2"

icechunk:
  branch: "main"
  snapshot_id: "GEAMAHQ7BRVPG9SQPK20"  # pinned 2026-07-31: reprocessed with missing bed picks + new noise metrics

extract:
  qc_only: true
  max_traces: null
  min_thickness_m: 100  # drop traces with radar thickness below this
  include_nondetections: true  # keep attempted-but-unpicked bed traces (reprocessed store)

datasets:
  - name: bedmachine
    region: greenland
    version: "6"
    # surface/thickness/mask come from the full netCDF (~2.8 GB); only `bed`
    # has a standalone GeoTIFF. Drop to just [bed] to use the smaller GeoTIFF.
    variables: [bed, surface, thickness, mask, errbed]
  - name: itslive
    region: greenland
  - name: era5  # mean t2m from the WeatherBench2 1990-2019 climatology (period fixed by product)
  - name: ghf  # Colgan et al. (2022) geothermal heat flow + lower/upper bounds (regridded, non-topo, no NGRIP)
    region: greenland
