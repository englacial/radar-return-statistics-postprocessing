# UTIG (Antarctic). Input store: s3://opr-radar-metrics/icechunk/utig
store:
  backend: "s3"
  s3_bucket: "opr-radar-metrics"
  s3_prefix: "icechunk/utig"
  s3_region: "us-west-2"

icechunk:
  branch: "main"
  snapshot_id: "DS449QPKYFC4E98J1G80"  # pinned 2026-05-28; re-pin via `resolve-snapshot`

extract:
  qc_only: true
  max_traces: null
  min_thickness_m: 100  # drop traces with radar thickness below this

datasets:
  - name: bedmachine
    region: antarctic
    version: "4"
    variables: [bed, surface, thickness, mask, errbed]
  - name: measures_vel  # MEaSUREs phase-based (NSIDC-0754); ITS_LIVE has a polar hole
    region: antarctic
  - name: era5  # mean t2m from the WeatherBench2 1990-2019 climatology (period fixed by product)
  - name: ghf  # Lösing & Ebbing (2021) geothermal heat flow + lower/upper bounds (regridded, non-topo)
    region: antarctic
